<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 20px; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px 15px; border-radius: 8px; background: var(--tg-theme-button-color, #248bed); color: white; border: none; }
        .track { background: rgba(0,0,0,0.05); padding: 10px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="input-group">
        <input type="text" id="songQuery" placeholder="Название песни...">
        <button onclick="searchMusic()">Найти</button>
    </div>
    <div id="results" style="margin-top: 20px;"></div>

    <script>
        const tg = window.Telegram.WebApp;

        async function searchMusic() {
            const query = document.getElementById('songQuery').value;
            const resDiv = document.getElementById('results');
            if(!query) return;

            resDiv.innerHTML = "Ищу везде...";
            
            // Попробуем альтернативный открытый источник (Deezer)
            try {
                const response = await fetch(`https://api.deezer.com/search?q=${encodeURIComponent(query)}&output=jsonp`, {
                    mode: 'no-cors' // Особенности работы с Deezer из браузера
                });
                // В браузере напрямую Deezer бывает сложен, поэтому лучше использовать твой Python сервер как мост
                // Но пока давай попробуем еще раз Jamendo с гарантированным ключом:
                const jRes = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=56d3047d&format=json&limit=10&search=${encodeURIComponent(query)}`);
                const data = await jRes.json();
                
                resDiv.innerHTML = "";
                if(data.results.length > 0) {
                    data.results.forEach(track => {
                        const div = document.createElement('div');
                        div.className = 'track';
                        div.innerHTML = `<span>${track.name} - ${track.artist_name}</span><button onclick="new Audio('${track.audio}').play()">▶️</button>`;
                        resDiv.appendChild(div);
                    });
                } else {
                    resDiv.innerHTML = "Ничего не найдено. Попробуй запрос 'Lofi'.";
                }
            } catch (e) {
                resDiv.innerHTML = "Ошибка связи.";
            }
        }
    </script>
</body>
</html>
