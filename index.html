<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { 
            --bg: var(--tg-theme-bg-color, #fff); 
            --text: var(--tg-theme-text-color, #000); 
            --btn: var(--tg-theme-button-color, #248bed); 
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .search-box { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        button { padding: 10px 15px; border-radius: 10px; background: var(--btn); color: #fff; border: none; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" id="query" placeholder="Название трека...">
        <button onclick="sendQuery()">Найти</button>
    </div>
    <div id="results" style="margin-top: 15px; font-size: 14px; color: gray;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        function sendQuery() {
            const val = document.getElementById('query').value;
            const resDiv = document.getElementById('results');
            
            if(!val) {
                alert("Введите название песни!");
                return;
            }

            resDiv.innerHTML = "🔍 Отправка запроса боту...";

            // Отправляем чистый текст боту (как он и ожидает в Pydroid)
            tg.sendData(val);
            
            // Закрываем приложение, чтобы увидеть ответ бота в чате
            setTimeout(() => {
                tg.close();
            }, 500);
        }
    </script>
</body>
</html>
