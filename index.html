<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --btn: var(--tg-theme-button-color, #248bed);
        }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        input { width: 70%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { padding: 10px; border-radius: 8px; background: var(--btn); color: #fff; border: none; cursor: pointer; }
        button:active { opacity: 0.5; }
        .track { background: rgba(0,0,0,0.05); padding: 10px; margin-top: 10px; border-radius: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div style="display: flex; gap: 5px;">
        <input type="text" id="q" placeholder="Напр. Rock...">
        <button id="searchBtn" onclick="doSearch()">Найти</button>
    </div>
    <div id="out" style="margin-top: 20px;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        
        async function doSearch() {
            const query = document.getElementById('q').value;
            const out = document.getElementById('out');
            const btn = document.getElementById('searchBtn');
            
            if(!query) return;

            btn.innerText = "⏳..."; // Показываем, что нажали
            out.innerHTML = "Поиск...";

            try {
                // Прямой запрос к API
                const response = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=56d3047d&format=json&limit=10&search=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                out.innerHTML = ""; // Очищаем

                if (data.results && data.results.length > 0) {
                    data.results.forEach(track => {
                        const div = document.createElement('div');
                        div.className = 'track';
                        div.innerHTML = `
                            <span>${track.name}</span>
                            <button onclick="new Audio('${track.audio}').play()">▶️</button>
                        `;
                        out.appendChild(div);
                    });
                } else {
                    out.innerHTML = "Ничего не найдено. Попробуй поискать 'Rock' или 'Lofi' (база API ограничена).";
                }
            } catch (e) {
                out.innerHTML = "Ошибка: " + e.message;
            } finally {
                btn.innerText = "Найти";
            }
        }
    </script>
</body>
</html>
